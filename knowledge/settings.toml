# Non-secret service settings. Secrets are supplied through process environment.
[app]
cors_origins = []

# Initial Gemini routes; validate quality for each extraction task before rollout.
# Override individual routes with LLM_<TIER>__MODEL and LLM_<TIER>__PROVIDER.
[llm-models]
timeout_seconds = 60
max_retries = 2

[llm-models.instant]
provider = "gemini"
model = "gemini-3.5-flash-lite"

[llm-models.standard]
provider = "gemini"
model = "gemini-3.8-flash"

[llm-models.complex]
provider = "gemini"
model = "gemini-3.8-flash"

