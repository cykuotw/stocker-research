[project]
name = "stocker-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "cykuo", email = "cykuotw45@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.110",
    "httpx>=0.28.1",
    "langchain>=1.4.4",
    "langchain-core>=1.6.9",
    "langchain-google-genai>=4.4.0",
    "langgraph>=1.2.14",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
stocker-agent = "stocker_agent:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.33",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    "ty>=0.0.85",
]
